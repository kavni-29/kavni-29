      <path d="M960 254C930 224 929 190 950 164C981 185 985 220 960 254Z" fill="#91B7AE" fill-opacity=".75"/>
      <path d="M958 246L950 164" stroke-width="1.5"/>
      <path d="M978 220C1014 218 1038 197 1043 165C1008 158 981 180 978 220Z" fill="#B98E79" fill-opacity=".73"/>
      <path d="M988 211L1043 165" stroke-width="1.5"/>
      <path d="M995 178C973 151 977 123 996 101C1021 124 1019 153 995 178Z" fill="#C99AA9" fill-opacity=".74"/>
      <path d="M994 170L996 101" stroke-width="1.5"/>
