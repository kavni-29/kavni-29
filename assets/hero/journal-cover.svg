    <circle cx="996" cy="98" r="8" fill="#C99AA9" stroke="#292725" stroke-width="2"/>
    <circle cx="849" cy="203" r="4" fill="#806784"/>
    <circle cx="1059" cy="349" r="4" fill="#B98E79"/>
    <text x="790" y="220" fill="#806784" font-family="Georgia, serif" font-size="14" font-style="italic">fig. i — curiosity</text>
    <text x="1005" y="387" fill="#806784" font-family="Georgia, serif" font-size="14" font-style="italic">growth, iterative</text>
    <text x="858" y="481" fill="#806784" font-family="Georgia, serif" font-size="11" letter-spacing="1.4">SPECIMEN NO. 29 · KAVNI-29</text>
  </g>
</svg>
